name: Build installers
# Manual only. Publishing a release (so installed copies can update) happens only when run from main with "publish" ticked.
# Releases go to the repo the workflow runs in, with the built-in token. Installed copies check the public repo
# defmellow/matinee-app (electron/updater.js), so only releases made there reach people.
# Never rename this file: the version comes from this workflow's run number: 1.N.0 in the public repo (run 1 = 1.0.0),
# 0.N.0 anywhere else (test builds).
# One job makes the release, then Windows, Linux and macOS build in parallel and upload into it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (from main, or from an experimental/* branch as a pre-release)'
        type: boolean
        default: true
      version:
        description: 'Optional exact version such as 1.4.1 (leave empty to count up automatically)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: publish-windows
  cancel-in-progress: false
env:
  PUBLISH: ${{ inputs.publish && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/experimental/')) }}
  EXPERIMENTAL: ${{ startsWith(github.ref, 'refs/heads/experimental/') }}
  VERSION_INPUT: ${{ inputs.version }}
  # electron-builder uploads into the release of the repo this runs in (build/electron-builder.yml names the public one).
  PUBLISH_TO: -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
  REPO_NAME: ${{ github.event.repository.name }}
jobs:
  release:
    # Works out the version once and (when publishing) creates the release, because electron-builder's parallel uploads race to create it.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the version (1.<n>.0 in the public repo, 0.<n>.0 elsewhere; experimental builds get -exp.<run> so they sort below the real release)
        id: stamp
        run: |
          if [ "$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" = "defmellow/matinee-app" ]; then   # GitHub shows it as Matinee-app
            major=$(node -p "require('./package.json').version.split('.')[0]")
            minor=$(( ${{ github.run_number }} - 1 ))
          else
            major=0
            minor=$(( ${{ github.run_number }} - 12 ))
          fi
          v="$major.$minor.0"
          if [ -n "$VERSION_INPUT" ]; then v="$VERSION_INPUT"; fi
          if [ "$EXPERIMENTAL" = "true" ]; then v="$v-exp.${{ github.run_number }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-exp\.[0-9]+)?$' || { echo "Bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Create the release
        id: create
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes = the top section of the changelog (experimental builds use the experimental changelog when it exists).
          log=docs/CHANGELOG.md
          if [ "$EXPERIMENTAL" = "true" ] && [ -f docs/CHANGELOG-experimental.md ]; then log=docs/CHANGELOG-experimental.md; fi
          node scripts/release-notes.mjs "$log" notes.md
          # Test builds publish no update notes (those are written or approved by the owner before a public release).
          if [ "$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" != "defmellow/matinee-app" ]; then echo "Test build from ${GITHUB_SHA::7}. Not for release; it does not update itself." > notes.md; fi
          flag=""
          if [ "$EXPERIMENTAL" = "true" ]; then flag="--prerelease"; fi
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            echo "Release v$APP_VERSION already exists; leaving it as it is."
          else
            gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "Matinee ${APP_VERSION%.0}" --notes-file notes.md $flag
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: release
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the version
        shell: bash
        run: |
          npm pkg set version="$APP_VERSION"
          # A test build (any repo but the public one) never updates itself: the updater would swap it for the public release.
          if [ "$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" != "defmellow/matinee-app" ]; then npm pkg set matinee.testBuild=true --json; fi
      - run: npm run build:ui
      - name: Build (and publish when allowed)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PUBLISH" = "true" ]; then mode=always; else mode=never; fi
          echo "Publish mode: $mode"
          if [ "$EXPERIMENTAL" = "true" ]; then rt="-c.publish.releaseType=prerelease"; else rt=""; fi
          npx electron-builder --win --publish "$mode" --config build/electron-builder.yml $rt $PUBLISH_TO
      - name: Check the update files
        shell: bash
        run: |
          grep -q "repo: $REPO_NAME$" release/win-unpacked/resources/app-update.yml || { echo "app-update.yml does not point at $REPO_NAME"; cat release/win-unpacked/resources/app-update.yml; exit 1; }
          grep -q "^version: $APP_VERSION$" release/latest.yml || { echo "latest.yml version is not $APP_VERSION"; cat release/latest.yml; exit 1; }
          ls -l release/Matinee-$APP_VERSION-Windows.exe release/Matinee-$APP_VERSION-Windows-Portable.exe
          echo "Update files look right for $APP_VERSION"
      - name: Get Playwright's Electron driver for the smoke test (no browsers needed)
        shell: bash
        run: npm install -g playwright-core@1.63.0
      - name: Launch the built app and walk through it
        shell: bash
        run: node test/smoke/electron-smoke.mjs release/win-unpacked/Matinee.exe smoke-shots-windows
      - name: Keep the smoke test pictures
        if: always()
        continue-on-error: true # storage quota can run out; the pictures are a help, not the test
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: smoke-windows
          path: smoke-shots-windows
          if-no-files-found: warn

  linux:
    needs: release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the version
        run: |
          npm pkg set version="$APP_VERSION"
          # A test build (any repo but the public one) never updates itself: the updater would swap it for the public release.
          if [ "$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" != "defmellow/matinee-app" ]; then npm pkg set matinee.testBuild=true --json; fi
      - run: npm run build:ui
      - name: Build (and publish when allowed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PUBLISH" = "true" ]; then mode=always; else mode=never; fi
          echo "Publish mode: $mode"
          if [ "$EXPERIMENTAL" = "true" ]; then rt="-c.publish.releaseType=prerelease"; else rt=""; fi
          npx electron-builder --linux AppImage deb --publish "$mode" --config build/electron-builder.yml $rt $PUBLISH_TO
      - name: Check the update files
        run: |
          f=release/linux-unpacked/resources/app-update.yml
          grep -q "repo: $REPO_NAME$" "$f" || { echo "app-update.yml does not point at $REPO_NAME"; cat "$f"; exit 1; }
          grep -q "^version: $APP_VERSION$" release/latest-linux.yml || { echo "latest-linux.yml version is not $APP_VERSION"; cat release/latest-linux.yml; exit 1; }
          ls -l release/Matinee-$APP_VERSION-Linux.AppImage release/Matinee-$APP_VERSION-Linux.deb
          echo "Update files look right for $APP_VERSION"
      - name: Get Playwright's Electron driver for the smoke test (no browsers needed)
        run: npm install -g playwright-core@1.63.0
      - name: Launch the built app and walk through it
        run: xvfb-run -a node test/smoke/electron-smoke.mjs release/linux-unpacked/matinee smoke-shots-linux
      - name: Keep the smoke test pictures
        if: always()
        continue-on-error: true # storage quota can run out; the pictures are a help, not the test
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: smoke-linux
          path: smoke-shots-linux
          if-no-files-found: warn

  macos:
    needs: release
    runs-on: macos-latest # Apple Silicon; both chips are built here
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned: never go looking for a certificate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the version
        run: |
          npm pkg set version="$APP_VERSION"
          # A test build (any repo but the public one) never updates itself: the updater would swap it for the public release.
          if [ "$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" != "defmellow/matinee-app" ]; then npm pkg set matinee.testBuild=true --json; fi
      - run: npm run build:ui
      - name: Build (and publish when allowed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PUBLISH" = "true" ]; then mode=always; else mode=never; fi
          echo "Publish mode: $mode"
          if [ "$EXPERIMENTAL" = "true" ]; then rt="-c.publish.releaseType=prerelease"; else rt=""; fi
          # Two runs so each file gets a plain name (Mac-Intel, then Mac). Apple Silicon goes last, so its latest-mac.yml is the one
          # left in the release (Mac copies only read the version from it).
          npx electron-builder --mac --x64 --publish "$mode" --config build/electron-builder.yml $rt $PUBLISH_TO '-c.mac.artifactName=Matinee-${version}-Mac-Intel.${ext}'
          npx electron-builder --mac --arm64 --publish "$mode" --config build/electron-builder.yml $rt $PUBLISH_TO
      - name: Check the update files
        run: |
          f=release/mac-arm64/Matinee.app/Contents/Resources/app-update.yml
          grep -q "repo: $REPO_NAME$" "$f" || { echo "app-update.yml does not point at $REPO_NAME"; cat "$f"; exit 1; }
          grep -q "^version: $APP_VERSION$" release/latest-mac.yml || { echo "latest-mac.yml version is not $APP_VERSION"; cat release/latest-mac.yml; exit 1; }
          ls -l release/Matinee-$APP_VERSION-Mac.dmg release/Matinee-$APP_VERSION-Mac-Intel.dmg release/Matinee-$APP_VERSION-Mac.zip release/Matinee-$APP_VERSION-Mac-Intel.zip
          # Each file must hold the app for its own chip (v1.0 and v1.1 shipped the Intel app in the Apple Silicon .dmg).
          chip() { local m; m=$(hdiutil attach -nobrowse -readonly "$1" | grep -o '/Volumes/.*' | head -1); lipo -archs "$m/Matinee.app/Contents/MacOS/Matinee"; hdiutil detach "$m" >/dev/null; }
          zchip() { local d; d=$(mktemp -d); unzip -q "$1" 'Matinee.app/Contents/MacOS/Matinee' -d "$d"; lipo -archs "$d/Matinee.app/Contents/MacOS/Matinee"; }
          for f in Mac.dmg:arm64 Mac-Intel.dmg:x86_64; do got=$(chip "release/Matinee-$APP_VERSION-${f%%:*}"); [ "$got" = "${f##*:}" ] || { echo "${f%%:*} holds $got, not ${f##*:}"; exit 1; }; done
          for f in Mac.zip:arm64 Mac-Intel.zip:x86_64; do got=$(zchip "release/Matinee-$APP_VERSION-${f%%:*}"); [ "$got" = "${f##*:}" ] || { echo "${f%%:*} holds $got, not ${f##*:}"; exit 1; }; done
          [ "$(grep -c 'url: Matinee' release/latest-mac.yml)" -eq 2 ] || { echo "latest-mac.yml should list one zip and one dmg"; cat release/latest-mac.yml; exit 1; }
          echo "Update files look right for $APP_VERSION"
      - name: Get Playwright's Electron driver for the smoke test (no browsers needed)
        run: npm install -g playwright-core@1.63.0
      - name: Check both Mac apps are sealed (an Apple Silicon Mac refuses a broken seal as "damaged")
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Matinee.app
          codesign --verify --deep --strict --verbose=2 release/mac/Matinee.app
      - name: Launch the built app and walk through it
        run: node test/smoke/electron-smoke.mjs release/mac-arm64/Matinee.app/Contents/MacOS/Matinee smoke-shots-macos
      - name: Walk through the Intel Mac app too (under Rosetta)
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          node test/smoke/electron-smoke.mjs release/mac/Matinee.app/Contents/MacOS/Matinee smoke-shots-macos/intel
      - name: Keep the smoke test pictures
        if: always()
        continue-on-error: true # storage quota can run out; the pictures are a help, not the test
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: smoke-macos
          path: smoke-shots-macos
          if-no-files-found: warn

  cleanup:
    # Installed copies read "latest": an empty release left by a failed run would confuse them. Only a failed Windows build removes it;
    # a failed Mac or Linux build leaves the Windows files up (those systems just miss that release).
    needs: [release, windows, linux, macos]
    if: always() && needs.release.outputs.version != '' && needs.windows.result == 'failure' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the release if this run created it and then a build failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED: ${{ needs.release.outputs.created }}
          V: ${{ needs.release.outputs.version }}
        run: |
          if [ "$CREATED" = "true" ]; then gh release delete "v$V" --yes --cleanup-tag || true; fi
